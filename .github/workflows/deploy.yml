name: Build and Deploy to IPFS

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build static site
        run: bun run build

      - name: Upload to IPFS via Pinata
        id: pinata
        uses: anantaramdas/ipfs-pinata-deploy-action@v1.6.4
        with:
          pin-name: portfolio-${{ github.sha }}
          path: ./out
          pinata-api-key: ${{ secrets.PINATA_API_KEY }}
          pinata-secret-api-key: ${{ secrets.PINATA_SECRET_KEY }}

      - name: Pin on server and update IPNS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts 2>/dev/null
          # Pin on the server first so it provides the blocks alongside Pinata;
          # publishing an IPNS record for content the node does not hold leaves
          # public gateways dependent on Pinata alone and they time out.
          ssh -o StrictHostKeyChecking=accept-new $SERVER_USER@$SERVER_HOST \
            "ipfs pin add --progress=false /ipfs/${{ steps.pinata.outputs.hash }} && \
             ipfs name publish --resolve=false --key=portfolio /ipfs/${{ steps.pinata.outputs.hash }}"

      - name: Warm the eth.limo gateway cache
        env:
          CID: ${{ steps.pinata.outputs.hash }}
        run: |
          # eth.limo answers 504 "Content Unreachable" on the first request for
          # each path of a fresh CID while its backend fetches the blocks. Crawl
          # every file once (with retries) so visitors never see that window.
          HOST=https://axatbhardwaj.eth.limo
          echo "Waiting for eth.limo to resolve the new CID..."
          for i in $(seq 1 40); do
            ROOT=$(curl -s -D - -o /dev/null --max-time 30 "$HOST/?warm=$i" | tr -d '\r' | awk 'tolower($1)=="x-ipfs-roots:"{print $2}')
            [ "$ROOT" = "$CID" ] && { echo "resolved after $i attempts"; break; }
            sleep 15
          done
          [ "$ROOT" = "$CID" ] || echo "::warning::eth.limo still serving $ROOT, crawling anyway"
          cd out
          find . -type f | sed 's|^\./||; s|/index\.html$|/|; s|^index\.html$||' | sort -u > /tmp/paths.txt
          echo "warming $(wc -l < /tmp/paths.txt) paths"
          warm() {
            for try in 1 2 3 4 5 6; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 40 "$HOST/$1")
              [ "$code" = "200" ] && { echo "200 /$1"; return 0; }
              sleep 5
            done
            echo "::warning::$code /$1 after 6 tries"; return 0
          }
          export -f warm; export HOST
          xargs -a /tmp/paths.txt -P 6 -I{} bash -c 'warm "$@"' _ {}

      - name: Unpin old deployments
        env:
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET_KEY: ${{ secrets.PINATA_SECRET_KEY }}
        run: |
          CURRENT_CID="${{ steps.pinata.outputs.hash }}"
          echo "Current deployment CID: $CURRENT_CID"

          # Wait for Pinata to process the new pin
          echo "Waiting 30s for Pinata to propagate..."
          sleep 30

          # List all pinned files with "portfolio-" prefix
          PINS=$(curl -s -g -X GET \
            "https://api.pinata.cloud/data/pinList?status=pinned&metadata%5Bname%5D=portfolio-&pageLimit=1000" \
            -H "pinata_api_key: $PINATA_API_KEY" \
            -H "pinata_secret_api_key: $PINATA_SECRET_KEY")

          # Keep the newest previous deployment pinned so pages cached by
          # gateways or browsers during the switch-over still find their
          # chunks. Unpin everything older than that.
          OLD_CIDS=$(echo "$PINS" | jq -r --arg current "$CURRENT_CID" \
            '[.rows[] | select(.ipfs_pin_hash != $current)] | sort_by(.date_pinned) | reverse | .[1:] | .[].ipfs_pin_hash')

          if [ -z "$OLD_CIDS" ]; then
            echo "No old pins to clean up"
            exit 0
          fi

          # Unpin each old deployment
          for cid in $OLD_CIDS; do
            echo "Unpinning old deployment: $cid"
            curl -s -X DELETE \
              "https://api.pinata.cloud/pinning/unpin/$cid" \
              -H "pinata_api_key: $PINATA_API_KEY" \
              -H "pinata_secret_api_key: $PINATA_SECRET_KEY"
          done

          echo "Cleaned up $(echo "$OLD_CIDS" | wc -l) old pin(s)"

      - name: Summary
        run: |
          echo "### Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**IPFS Hash**: \`${{ steps.pinata.outputs.hash }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Preview**: https://gateway.pinata.cloud/ipfs/${{ steps.pinata.outputs.hash }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**IPNS**: Updated automatically via server" >> $GITHUB_STEP_SUMMARY
